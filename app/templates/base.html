
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=3">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4">
<link rel="alternate icon" type="image/png" href="/static/favicon.png">
  <title>{% block title %}LaunchForge{% endblock %}</title>

  <meta name="theme-color" content="#080B09">

  <style>
    :root {
      --bg: #080B09;
      --surface: #0D120F;
      --surface-hover: #131A15;
      --border: rgba(255,255,255,.08);
      --text: #F8FAFC;
      --muted: #94A3B8;
      --green: #22C55E;
      --green-light: #4ADE80;
      --green-dark: #15803D;
      --danger: #EF4444;
      --warning: #FBBF24;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--green-light);
      text-decoration: none;
      transition: color .2s ease;
    }

    a:hover {
      color: var(--green);
    }

    button, input, textarea {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: rgba(34,197,94,.3);
      color: white;
    }

    /* NAVIGATION */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,11,9,.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1200px;
      min-height: 76px;
      margin: 0 auto;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    nav .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      color: white;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    nav .logo-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: #4ADE80;
  flex-shrink: 0;
}

nav .logo-mark svg {
  width: 23px;
  height: 23px;
  display: block;
}

    nav .nav-link {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 500;
    }

    nav .nav-link:hover {
      color: var(--green-light);
    }

    nav form {
      margin: 0;
    }

    /* PAGE LAYOUT */

    main {
      width: 100%;
      max-width: 1200px;
      min-height: calc(100vh - 160px);
      margin: 0 auto;
      padding: 48px 28px 90px;
    }

    h1, h2, h3, h4 {
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -.5px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 16px;
      font-weight: 800;
    }

    h2 {
      font-size: 1.5rem;
      margin: 0 0 12px;
    }

    h3 {
      font-size: 1.15rem;
    }

    p {
      color: var(--muted);
    }

    .muted {
      color: var(--muted);
    }

    /* CARDS */

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin: 16px 0;
      transition: border-color .2s ease, transform .2s ease;
    }

    .card:hover {
      border-color: rgba(74,222,128,.2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .grid .card {
      margin: 0;
    }

    /* BUTTONS */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--green);
      color: #061008;
      border: 1px solid var(--green);
      border-radius: 9px;
      padding: 11px 20px;
      font-weight: 700;
      font-size: .94rem;
      cursor: pointer;
      transition: all .2s ease;
    }

    .btn:hover {
      background: var(--green-light);
      border-color: var(--green-light);
      color: #061008;
      transform: translateY(-1px);
      text-decoration: none;
    }

    .btn.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .btn.ghost:hover {
      color: var(--green-light);
      border-color: var(--green);
      background: rgba(34,197,94,.06);
    }

    .btn.danger {
      background: #991B1B;
      color: white;
      border-color: #991B1B;
    }

    .btn.small {
      padding: 7px 13px;
      font-size: .85rem;
    }

    /* FORMS */

    label {
      display: block;
      color: #E2E8F0;
      font-weight: 600;
      font-size: .9rem;
      margin: 16px 0 7px;
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=search],
    textarea {
      width: 100%;
      padding: 12px 14px;
      color: white;
      background: #080D0A;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      font: inherit;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748B;
    }

    input:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34,197,94,.12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    /* STATUS AND BADGES */

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(34,197,94,.12);
      color: var(--green-light);
      font-size: .76rem;
      font-weight: 700;
    }

    .High {
      background: rgba(239,68,68,.15);
      color: #FCA5A5;
    }

    .Medium {
      background: rgba(251,191,36,.15);
      color: #FCD34D;
    }

    .Low {
      background: rgba(34,197,94,.15);
      color: var(--green-light);
    }

    .error {
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.25);
      color: #FCA5A5;
      padding: 12px 16px;
      border-radius: 9px;
      margin: 14px 0;
    }

    /* TABLES */

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .94rem;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: #E2E8F0;
      font-weight: 700;
    }

    td {
      color: var(--muted);
    }

    /* COMMON UTILITIES */

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero {
      text-align: center;
      padding: 85px 0 60px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
    }

    .disclaimer {
      font-size: .88rem;
      border-left: 3px solid var(--warning);
      background: rgba(251,191,36,.06);
      padding: 14px 18px;
      color: #CBD5E1;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: #64748B;
      font-size: .85rem;
    }

    /* ACCESSIBILITY */

    :focus-visible {
      outline: 2px solid var(--green-light);
      outline-offset: 3px;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {
      nav {
        gap: 14px;
        padding: 12px 18px;
        flex-wrap: wrap;
      }

      nav .logo {
        width: 100%;
      }

      nav .nav-link {
        font-size: .85rem;
      }

      main {
        padding: 32px 18px 60px;
      }

      .hero {
        padding: 55px 0 35px;
      }

      .card {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <a class="logo" href="/">
      <span class="logo-mark">
  <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <path d="M16 3.5C11.2 7.4 9 12.1 9 18l7 5.2 7-5.2c0-5.9-2.2-10.6-7-14.5Z"
          fill="currentColor"/>
    <circle cx="16" cy="13" r="2.6" fill="#0D120F"/>
    <path d="M9.3 15.5 5.5 19l1.1 5.2 5.1-3.2M22.7 15.5l3.8 3.5-1.1 5.2-5.1-3.2"
          fill="currentColor"/>
    <path d="M13.5 23.3 16 28l2.5-4.7"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</span>
      LaunchForge
    </a>

    <a class="nav-link" href="/explore">Explore</a>

    {% if user %}
      <a class="nav-link" href="/generate">Generate</a>
      <a class="nav-link" href="/dashboard">My plans</a>

      <form method="post" action="/logout">
        <button class="btn ghost small" type="submit">
          Log out
        </button>
      </form>
    {% else %}
      <a class="nav-link" href="/login">Log in</a>
      <a class="btn small" href="/register">Get started</a>
    {% endif %}
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <p>© 2026 LaunchForge. Built for the next generation of founders.</p>
</footer>

</body>
</html>
