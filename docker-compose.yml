# Starts the web app + a PostgreSQL database:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchforge
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: launchforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # overrides DATABASE_URL from .env so the app talks to the db container
      DATABASE_URL: postgresql://launchforge:change_me@db:5432/launchforge
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
